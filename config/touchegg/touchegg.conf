<touchégg>

  <settings>
    <property name="composed_gestures_time">0</property>
  </settings>

  <application name="All">
    <gesture type="SWIPE" fingers="3" direction="UP">
      <action type="SEND_KEYS">Super+F</action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="DOWN">
      <action type="SEND_KEYS">Super+Q</action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="LEFT">
      <action type="SEND_KEYS">Super+Left</action>
    </gesture>

    <gesture type="SWIPE" fingers="3" direction="RIGHT">
      <action type="SEND_KEYS">Super+Right</action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="UP">
      <action type="SEND_KEYS">Super+Space</action>
    </gesture>

    <gesture type="SWIPE" fingers="4" direction="DOWN">
      <action type="SEND_KEYS">Super+V</action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="IN">
      <action type="SEND_KEYS">Super+Minus</action>
    </gesture>

    <gesture type="PINCH" fingers="2" direction="OUT">
      <action type="SEND_KEYS">Super+Equal</action>
    </gesture>
  </application>

</touchégg>
